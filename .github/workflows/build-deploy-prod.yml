# Builds main and deploys it to prod - shared by deploy.prod.yml and base-image-refresh.yml
# Callers need `permissions: { contents: read, id-token: write }` and `secrets: inherit`.
name: Build and deploy to prod
on: workflow_call

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      team: personbruker
      image-suffix: prod
      # The Dockerfile copies the Next.js standalone output, which has its own node_modules.
      prune-remove: ''
      playwright: DECORATOR_ENV=prod pnpm exec playwright test
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: prod-gcp
      resource: .nais/nais-prod.yaml
      # The manifest does not template {{ image }}.
      workload-image: ${{ needs.build.outputs.image }}
      environment: prod
