name: Deploy dev

on:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      ref: ${{ github.sha }}
      environment_name: dev
      cluster: dev-gcp
      manifest_path: .nais/nais-dev.yaml
      decorator_environment: dev
    secrets: inherit
