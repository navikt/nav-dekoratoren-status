name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy to dev
        required: true
        default: main
        type: string

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      ref: ${{ inputs.ref }}
      environment_name: dev
      cluster: dev-gcp
      manifest_path: .nais/nais-dev.yaml
      decorator_environment: dev
    secrets: inherit
