name: Deploy environment

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      cluster:
        required: true
        type: string
      manifest_path:
        required: true
        type: string
      decorator_environment:
        required: true
        type: string
      require_tag:
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    env:
      DEPLOY_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Verify release tag
        if: ${{ inputs.require_tag }}
        run: |
          git check-ref-format --allow-onelevel "refs/tags/${DEPLOY_REF}"
          git ls-remote --exit-code --refs origin "refs/tags/${DEPLOY_REF}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DECORATOR_ENV: ${{ inputs.decorator_environment }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          DECORATOR_ENV: ${{ inputs.decorator_environment }}
      - name: Build and push image and SBOM to OCI registry
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-build-push
        with:
          team: personbruker

  deploy:
    name: Deploy ${{ inputs.environment_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: personbruker
      - name: Deploy to Nais
        run: |
          nais apply "${{ inputs.manifest_path }}" \
            --environment "${{ inputs.cluster }}" \
            --set spec.image="${{ needs.build.outputs.image }}" \
            --wait
