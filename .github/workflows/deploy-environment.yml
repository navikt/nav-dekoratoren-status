name: Deploy environment

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      cluster:
        required: true
        type: string
      manifest_path:
        required: true
        type: string
      decorator_environment:
        required: true
        type: string
      require_tag:
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    env:
      DEPLOY_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Verify release tag
        if: ${{ inputs.require_tag }}
        run: |
          git check-ref-format --allow-onelevel "refs/tags/${DEPLOY_REF}"
          git ls-remote --exit-code --refs origin "refs/tags/${DEPLOY_REF}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
      - run: pnpm config set '//npm.pkg.github.com/:_authToken' "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DECORATOR_ENV: ${{ inputs.decorator_environment }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          DECORATOR_ENV: ${{ inputs.decorator_environment }}
      - name: Build and push image and SBOM to OCI registry
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        id: docker-build-push
        with:
          team: personbruker

  deploy:
    name: Deploy ${{ inputs.environment_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: nais/setup@ea33c90b68228e6f04fb34b88bfd8ab6ad523ce8 # v1.0.2
        with:
          team: personbruker
      - name: Deploy to Nais
        run: |
          nais apply "${{ inputs.manifest_path }}" \
            --environment "${{ inputs.cluster }}" \
            --set spec.image="${{ needs.build.outputs.image }}" \
            --wait
