name: Deploy prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      ref: ${{ github.sha }}
      environment_name: prod
      cluster: prod-gcp
      manifest_path: .nais/nais-prod.yaml
      decorator_environment: prod
    secrets: inherit
