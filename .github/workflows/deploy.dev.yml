name: Deploy to dev
on: workflow_dispatch

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      team: personbruker
      image-suffix: dev
      # The Dockerfile copies the Next.js standalone output, which has its own node_modules.
      prune-remove: ''
      playwright: DECORATOR_ENV=dev pnpm exec playwright test
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: dev-gcp
      resource: .nais/nais-dev.yaml
      # The manifest does not template {{ image }}.
      workload-image: ${{ needs.build.outputs.image }}
      environment: dev
